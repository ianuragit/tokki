name: Build

# - push to main / manual run: build installers and upload them as workflow artifacts
#   (download from the run's page in the Actions tab)
# - tag v*: same build, plus attach the installers to the GitHub Release for that tag
on:
  push:
    branches: [main, claude/charming-ritchie-sko8mk] # TEMP: build this branch
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: dist:win
            files: release/*.exe
          - os: macos-latest
            name: mac
            script: dist:mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Unsigned builds: skip code signing and notarization instead of failing.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, build and test
        run: npm test

      - name: Build installers
        run: npm run ${{ matrix.script }}

      - name: Upload installers (Tokki-${{ matrix.name }})
        uses: actions/upload-artifact@v5
        with:
          name: Tokki-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true

      - name: Create/update release ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
