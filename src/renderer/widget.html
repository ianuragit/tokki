<html lang="en">

  <title>Tokki</title>
  <link rel="stylesheet" href="widget.css" />

      <div class="cell" data-id="chatgpt">
        <span class="lbl">G</span><span class="val">…</span>
      </div>
    </div>
  </div>
  <script src="widget.js"></script>

</html>
